# ── Sentiment Trading Alpha ──────────────────────────────────────
# Single container: frontend + backend
#
# Quick start:
#   cp .env.example .env          # Edit your API keys
#   docker compose up --build     # Build and run
#   docker compose down           # Stop
#
# The .env file is loaded automatically — no extra flags needed.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-trading
    ports:
      - "3000:3000"   # Frontend (Next.js)
      - "8000:8000"   # Backend (FastAPI)
    env_file:
      - .env
    environment:
      # Override database paths for Docker volume mount
      DATABASE_URL: sqlite:////data/trading_system.db
      DECISION_LOG_DATABASE_URL: sqlite:////data/decision_log.db
    volumes:
      - trading-data:/data   # Persist SQLite databases
    restart: unless-stopped
    # All variables from .env are injected automatically by Docker Compose
    # DATABASE_URL is overridden above for Docker compatibility

volumes:
  trading-data:
    driver: local
